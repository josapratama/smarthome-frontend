services:
  smarthome-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000" # Host:Container - Frontend di port 3001
    environment:
      # Server-side API calls (dari Next.js server ke backend)
      BACKEND_URL: "http://host.docker.internal:3000"

      # Client-side API calls (dari browser ke backend)
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:3000"

      # Frontend URL
      NEXT_PUBLIC_FRONTEND_URL: "http://localhost:3001"

      # App info
      NEXT_PUBLIC_APP_NAME: "Smart Home"

      NODE_ENV: "production"
    networks:
      - smarthome-network

networks:
  smarthome-network:
    external: true # Gunakan network yang sama dengan backend
